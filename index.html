  <title>투자 대시보드 · 미국 3대 지수</title>
  <meta name="description" content="나스닥 · S&P 500 · 다우존스 종가를 추적하는 투자 대시보드" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="topbar__title">
      <span class="topbar__mark" aria-hidden="true">📈</span>
      <div>
        <h1>투자 대시보드</h1>
        <p class="topbar__sub">미국 3대 지수 · 나스닥 · S&amp;P 500 · 다우존스</p>
      </div>
    </div>
    <div class="topbar__actions">
      <span id="asof" class="asof" title="가장 최근 기록 시각">—</span>
      <button id="refresh" class="btn" type="button" title="데이터 새로고침">
        <span class="btn__icon" aria-hidden="true">↻</span><span class="btn__label">새로고침</span>
      </button>
      <button id="theme" class="btn btn--icon" type="button" title="라이트/다크 전환" aria-label="테마 전환">
        <span aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <main id="main" class="wrap">
    <!-- non-blocking status banners (fallback / errors) -->
    <div id="banner" class="banner" hidden></div>

    <!-- market status strip -->
    <section class="status-strip" aria-label="시장 상태">
      <span id="market-badge" class="badge">—</span>
      <span id="market-note" class="status-strip__note"></span>
    </section>

    <!-- KPI cards, one per index -->
    <section class="kpi-grid" id="kpi-grid" aria-label="지수별 요약">
      <p class="loading">데이터를 불러오는 중…</p>
    </section>

    <!-- comparison chart -->
    <section class="panel" aria-labelledby="cmp-title">
      <div class="panel__head">
        <div>
          <h2 id="cmp-title" class="panel__title">지수 추이 비교</h2>
          <p class="panel__sub">첫 기록일을 0%로 맞춘 <strong>상대 수익률</strong> 비교 · 같은 축에서 세 지수를 나란히 봅니다.</p>
        </div>
        <div class="panel__tools">
          <div id="cmp-legend" class="legend" role="list" aria-label="범례"></div>
          <div id="range-picker" class="segmented" role="group" aria-label="기간 선택">
            <button class="segmented__btn" data-days="7" type="button">7일</button>
            <button class="segmented__btn" data-days="30" type="button">30일</button>
            <button class="segmented__btn" data-days="90" type="button">90일</button>
            <button class="segmented__btn is-active" data-days="0" type="button">전체</button>
          </div>
        </div>
      </div>
      <div id="cmp-chart" class="chart" aria-hidden="true"></div>
      <p id="cmp-empty" class="chart__empty" hidden></p>
    </section>

    <!-- recent records table -->
    <section class="panel" aria-labelledby="tbl-title">
      <div class="panel__head">
        <div>
          <h2 id="tbl-title" class="panel__title">최근 기록</h2>
          <p class="panel__sub">최신순 · 종가와 전일 대비 변동</p>
        </div>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th scope="col">기록(KST)</th>
              <th scope="col">지수</th>
              <th scope="col" class="num">종가</th>
              <th scope="col" class="num">전일 대비</th>
              <th scope="col" class="num">변동률</th>
              <th scope="col" class="num">고가</th>
              <th scope="col" class="num">저가</th>
              <th scope="col">상태</th>
            </tr>
          </thead>
          <tbody id="tbl-body">
            <tr><td colspan="8" class="loading">—</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>
      데이터 출처: CNBC / Yahoo Finance · 값은 정보 제공용이며 지연·정정될 수 있습니다.
      <br />
      이 페이지는 저장소의 <code>data/</code> 파일을 읽어 자동으로 갱신됩니다.
    </p>
  </footer>
