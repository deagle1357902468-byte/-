name: Deploy dashboard to GitHub Pages

# Publishes the repository root (index.html + assets/ + data/) to GitHub Pages.
# Requires: Settings → Pages → Source = "GitHub Actions".
#
# Runs automatically when the default branch updates (e.g. after the daily
# routine appends new closes), and can be run on demand from the Actions tab.
on:
  push:
    branches: ["claude/nasdaq-sp-dow-closing-routine-26j7ys"]
    paths:
      - "index.html"
      - "assets/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
