name: 일별 공개데이터 수집

# 매 거래일(월~금) 미국장 마감 후 공개 데이터(환율·벤치마크·종목시세·Fear&Greed)를
# 모아 커밋합니다. 개인 데이터는 다루지 않습니다.
on:
  schedule:
    - cron: "0 22 * * 1-5"   # UTC 22:00 (미국장 마감 후) · 월~금
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 수집 실행
        run: python3 "내투자대시보드/자동화/collect.py"
      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "내투자대시보드/자동화/데이터"
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(auto): 일별 공개데이터 수집 $(date -u +%Y-%m-%d)"
            git push
          fi
